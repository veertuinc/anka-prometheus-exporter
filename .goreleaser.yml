# This is an example goreleaser.yaml file with some defaults.
# Make sure to check the documentation at http://goreleaser.com
version: 2
env:
  - CGO_ENABLED=0
before:
  hooks:
    - make go.lint
    - make go.test

builds:
  # A separated build to run the packer-plugins-check only once for a linux_amd64 binary
  -
    id: darwin-amd64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath #removes all file system paths from the compiled executable
    ldflags:
      - '-s -w -X main.commit={{ .Commit }} -X main.version={{ .Version }}'
    goos:
      - darwin
    goarch:
      - amd64
    binary: '{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    no_unique_dist_dir: true
  -
    id: linux-amd64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath #removes all file system paths from the compiled executable
    ldflags:
      - '-s -w -X main.commit={{ .Commit }} -X main.version={{ .Version }}'
    goos:
      - linux
    goarch:
      - amd64
    binary: '{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    no_unique_dist_dir: true
  -
    id: darwin-arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath #removes all file system paths from the compiled executable
    ldflags:
      - '-s -w -X main.commit={{ .Commit }} -X main.version={{ .Version }}'
    goos:
      - darwin
    goarch:
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    no_unique_dist_dir: true
  -
    id: linux-arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath #removes all file system paths from the compiled executable
    ldflags:
      - '-s -w -X main.commit={{ .Commit }} -X main.version={{ .Version }}'
    goos:
      - linux
    goarch:
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    no_unique_dist_dir: true
archives:
  - formats:
      - zip
    files:
      - none*
    name_template: '{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: '{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS'
  algorithm: sha256
release:
  # Tag push (vX.Y.Z) creates the GitHub Release and uploads archives.
  draft: false
  prerelease: auto

changelog:
  disable: true