name: Check PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - edge
      - master
      - main

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Snapshot build needs a local tag; version is not published.
      - run: git tag "v0.0.0-pr"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run GoReleaser build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --single-target --snapshot --clean --verbose
